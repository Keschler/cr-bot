[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-bot"
version = "0.1.0"
description = "Clash Royale vision, tracking, and feature generation bot."
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
cr-bot = "cr_bot.app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
# Collection is bounded to the two real test roots.  Without this, a bare
# ``pytest`` from the repository root walks local virtualenvs, build output,
# and PyInstaller bundles that are not part of the project.
testpaths = ["tests", "simulator/tests"]
pythonpath = [".", "src"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "*.egg-info",
    "__pycache__",
    "build",
    "capture/build",
    "capture/dist",
    "dist",
    "outputs",
    "simulator/dist",
    "simulator/outputs",
    "vendor",
    "*.venv",
    "venv",
]
